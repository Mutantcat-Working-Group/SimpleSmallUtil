name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write
  packages: write

env:
  APP_NAME: simplesmallutil
  IMAGE: ghcr.io/mutantcat-working-group/simplesmallutil

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, sqlite, curl, mbstring, xml, fileinfo

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint PHP
        run: |
          php -l public/index.php
          find app config route -name '*.php' -print0 | xargs -0 -n1 php -l

  build:
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, sqlite, curl, mbstring, xml, fileinfo

      - name: Resolve version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-dev --no-progress --optimize-autoloader

      - name: Package release archive
        run: |
          mkdir -p dist
          tar --exclude='./.git' --exclude='./.github' --exclude='./dist' --exclude='./runtime/*.log' \
            -czf "dist/${APP_NAME}-${{ steps.version.outputs.value }}.tar.gz" .

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: dist/*.tar.gz
          if-no-files-found: error

  docker:
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum -- * > ../checksums.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/* checksums.txt --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" release-assets/* checksums.txt \
              --repo "${GITHUB_REPOSITORY}" --title "${TAG}" --generate-notes
          fi
